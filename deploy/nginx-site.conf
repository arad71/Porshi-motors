# For servers that already run Nginx on ports 80/443 (setup-server.sh --behind-proxy).
# setup-server.sh writes a copy with the real port and domain filled in.
server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# Then run:  certbot --nginx -d __DOMAIN__   (adds HTTPS to this block)
