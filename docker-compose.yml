# Porshi Motors: database + API + website/admin.
# Start:  cp .env.example .env   (then edit it)   &&   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: porshi
      POSTGRES_USER: porshi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-porshi}
      TZ: Asia/Dhaka
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porshi -d porshi"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Dhaka
      DATABASE_URL: postgresql+psycopg://porshi:${DB_PASSWORD:-porshi}@db:5432/porshi
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8095}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-PORSHI}
    volumes:
      - uploads:/data/uploads
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    logging: *logs
    ports:
      # Only reachable from this machine. On the server, Caddy (docker-compose.prod.yml) serves HTTPS.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8095}:80"

volumes:
  pgdata:
  uploads:
